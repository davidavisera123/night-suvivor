/* 1. REFERÊNCIAS */

    gravekeeper:{radius:48,hp:900,speed:55,contact:35,xp:100,color:"#dc2626"},
    witch:{radius:40,hp:1400,speed:70,contact:20,xp:100,color:"#a855f7"},

  },

    interval:300,warning:2,cycleHp:1.5,
    gravekeeper:{attackInterval:4,chargeWarning:.8,chargeSpeed:520,chargeTime:.7,ringCount:16,projectileSpeed:220,projectileDamage:12,projectileLife:4},
    witch:{teleportInterval:3,teleportFade:.4,teleportDistance:350,shotInterval:3,shotCount:5,shotSpread:.25,shotSpeed:300,shotDamage:14,summonInterval:10,summonCount:6},
    skeletonKing:{attackInterval:3.5,spiralDuration:3,spiralTick:.08,arms:4,projectileSpeed:240,projectileDamage:10,projectileLife:4,slamWarning:1,slamRadius:140,slamDamage:35}
  },
  waves:{spawnIntervalStart:.75,spawnIntervalMin:.12,bossMultiplier:2,miniBossFirst:210,miniBossPeriod:300,hordeFirst:360,hordePeriod:60,hordeCount:25,warning:2},
  xp:{magnetSpeed:180,baseRadius:70},
  drops:{coinChance:{zombie:.18,fast:.22,tank:.50,shooter:.30,exploder:.30,brute:1},tankCoinValue:2,healChance:.03,tankHealChance:.10,buffChance:.02,buffDuration:10,itemLife:30,blinkTime:5,chestCoinsMin:20,chestCoinsMax:40},
  colors:{player:"#60a5fa",enemy:"#ef4444"}
};
const CHARACTERS={
  guerreiro:{name:"Guerreiro",icon:"⚔️",hp:150,speed:205,weapon:"sword",desc:"Mais vida • começa com espada"},
  mago:{name:"Mago",icon:"🔮",hp:90,speed:220,weapon:"magic",desc:"Menos vida • magia em área"},
  arqueiro:{name:"Arqueiro",icon:"🏹",hp:100,speed:285,weapon:"arrow",desc:"Alta velocidade • flechas rápidas"}
};
const STATES={MENU:"MENU",SHOP:"SHOP",RECORDS:"RECORDS",PLAYING:"PLAYING",PAUSED:"PAUSED",LEVEL_UP:"LEVEL_UP",GAME_OVER:"GAME_OVER"};
const UPGRADES=[
  {id:"damage",icon:"⚔️",name:"Dano",desc:"+20% de dano e +20% no dano mágico.",max:8},
  {id:"maxhp",icon:"❤️",name:"Vida Máxima",desc:"+25 HP máximo e cura 25 HP.",max:null},
  {id:"speed",icon:"💨",name:"Velocidade",desc:"+10% de velocidade de movimento.",max:8},
  {id:"xpRadius",icon:"🧲",name:"Ímã XP",desc:"+30% no raio de coleta de XP.",max:5},
  {id:"regen",icon:"💚",name:"Regeneração",desc:"+0,5 HP por segundo.",max:null},
  {id:"heal",icon:"✨",name:"Cura",desc:"Recupera 50% da vida máxima.",max:null},
  {id:"fireRate",icon:"⚡",name:"Velocidade de disparo",desc:"+20% na frequência da arma principal.",max:8},
  {id:"projectileCount",icon:"🔹",name:"Projétil extra",desc:"+1 flecha por disparo.",max:3,characters:["arqueiro"]},
  {id:"swordRange",icon:"🗡️",name:"Alcance da Espada",desc:"+15% no alcance da espada.",max:5,characters:["guerreiro"]},
  {id:"mageRadius",icon:"💥",name:"Mago • Raio da explosão",desc:"+20% no raio da explosão.",max:5,characters:["mago"]},
  {id:"mageDamage",icon:"🔮",name:"Mago • Dano da explosão",desc:"+20% no dano da explosão.",max:8,characters:["mago"]},
  {id:"mageProjectiles",icon:"🌌",name:"Mago • Projétil mágico",desc:"+1 projétil mágico por disparo.",max:2,characters:["mago"]}
];


/* 3. ESTADO GLOBAL */
const game={state:STATES.MENU,character:"guerreiro",time:0,kills:0,pendingLevelUps:0,debugObstacles:false,bossActive:false,bossWarnings:0,bossNumber:0,bossCycle:0,nextBossAt:CONFIG.bosses.interval,miniBossWarnings:0,nextMiniBossAt:CONFIG.waves.miniBossFirst,nextHordeAt:CONFIG.waves.hordeFirst,hordeIndex:0,centerMessage:"",centerMessageTime:0};
let levelChoices=[],levelUpOpenedAt=0,chestUpgradePending=false;
const save={version:1,coins:0,unlockedCharacters:["guerreiro"],unlockedWeapons:["pistola","orbe"],shop:{vida:0,dano:0,velocidade:0,ima:0,xp:0},records:{bestTime:0,bestLevel:1,bestKills:0},byCharacter:{guerreiro:{bestTime:0,bestLevel:1,bestKills:0},mago:{bestTime:0,bestLevel:1,bestKills:0},arqueiro:{bestTime:0,bestLevel:1,bestKills:0}}};
const keys=Object.create(null),mouse={x:0,y:0,down:false},cam={x:0,y:0};
const world={enemies:[],gems:[],coins:[],pickups:[],shots:[],enemyShots:[],effects:[],chests:[]};
let player=null,last=performance.now(),focused=true,enemyIdSeq=1;

/* 4. UTILITÁRIOS */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function rand(min,max){return min+Math.random()*(max-min)}
function fmtTime(t){const s=Math.floor(t);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function xpNeeded(level){return level*CONFIG.player.xpBase}
function addEntity(list,obj,limit){if(list.length>=limit)return null;obj.dead=false;list.push(obj);return obj}
function cleanup(){for(const list of Object.values(world)){let w=0;for(let r=0;r<list.length;r++){const e=list[r];if(!e.dead)list[w++]=e}list.length=w}}
function clearWorld(){for(const list of Object.values(world))list.length=0}
function releaseKeys(){for(const k of Object.keys(keys))keys[k]=false}

/* 5. SAVE */
const SHOP_ITEMS={
  mago:{type:"character",id:"mago",name:"Mago",icon:"🔮",cost:250},
  arqueiro:{type:"character",id:"arqueiro",name:"Arqueiro",icon:"🏹",cost:400},
  bumerangue:{type:"weapon",id:"bumerangue",name:"Bumerangue",icon:"🪃",cost:300},
  explosao:{type:"weapon",id:"explosao",name:"Foice Sombria",icon:"🌑",cost:450},
  raio:{type:"weapon",id:"raio",name:"Raio",icon:"⚡",cost:500}
};
const SHOP_UPGRADES=[
  {id:"vida",icon:"❤️",name:"Vitalidade",desc:"+5% de vida máxima por nível",max:10,base:150},
  {id:"dano",icon:"⚔️",name:"Força",desc:"+3% de dano por nível",max:10,base:180},
  {id:"velocidade",icon:"💨",name:"Agilidade",desc:"+2% de velocidade por nível",max:10,base:160},
  {id:"ima",icon:"🧲",name:"Ímã",desc:"+5% de raio de XP por nível",max:8,base:140},
  {id:"xp",icon:"✨",name:"Experiência",desc:"+3% de XP por nível",max:10,base:200}
];
const SAVE_KEY="nightSurvivor.save.v1";
function defaultSave(){return JSON.parse(JSON.stringify(save))}
function validNum(v){return Number.isFinite(v)&&v>=0}
function loadSave(){const base=defaultSave();try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return base;const parsed=JSON.parse(raw);if(!parsed||parsed.version!==1)return base;const out=base;if(validNum(parsed.coins))out.coins=Math.min(999999999,Math.floor(parsed.coins));if(Array.isArray(parsed.unlockedCharacters))out.unlockedCharacters=parsed.unlockedCharacters.filter(id=>CHARACTERS[id]);if(!out.unlockedCharacters.includes("guerreiro"))out.unlockedCharacters.unshift("guerreiro");if(Array.isArray(parsed.unlockedWeapons))out.unlockedWeapons=parsed.unlockedWeapons.filter(id=>["pistola","orbe","bumerangue","raio","explosao"].includes(id));for(const k of Object.keys(out.shop)){if(parsed.shop&&validNum(parsed.shop[k]))out.shop[k]=Math.min(out.shop[k]===undefined?99:(k==="ima"?8:10),Math.floor(parsed.shop[k]))}if(parsed.records&&validNum(parsed.records.bestTime))out.records.bestTime=parsed.records.bestTime;if(parsed.records&&validNum(parsed.records.bestLevel))out.records.bestLevel=Math.floor(parsed.records.bestLevel);if(parsed.records&&validNum(parsed.records.bestKills))out.records.bestKills=Math.floor(parsed.records.bestKills);if(parsed.byCharacter&&typeof parsed.byCharacter==="object")for(const id of Object.keys(out.byCharacter)){const x=parsed.byCharacter[id];if(x&&validNum(x.bestTime))out.byCharacter[id].bestTime=x.bestTime;if(x&&validNum(x.bestLevel))out.byCharacter[id].bestLevel=Math.floor(x.bestLevel);if(x&&validNum(x.bestKills))out.byCharacter[id].bestKills=Math.floor(x.bestKills)}return out}catch{return base}}
let persistent=loadSave();
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(persistent))}catch{}}

/* 6. IMAGENS */
const images={mapa:new Image(),guerreiro:new Image(),mago:new Image(),arqueiro:new Image()};
images.guerreiro.src="guerreiro.png";images.mago.src="mago.png";images.arqueiro.src="arqueiro.png";

/* 7. MAPA/CÂMERA/COLISÃO */
const MAP_SCALE=4;
const MAP_ORIGINAL={w:694,h:556};
const NIGHT={on:true,darkness:.5,lightRadius:420};
const MAP={ready:false,w:0,h:0,minX:-Infinity,maxX:Infinity,minY:-Infinity,maxY:Infinity};
const OBSTACLES_IMAGE=[
  {x:22,y:108,w:78,h:78,name:"casa1"},
  {x:122,y:108,w:84,h:70,name:"casa2"},
  {x:145,y:190,w:88,h:80,name:"casa3"},
  {x:22,y:212,w:80,h:84,name:"casa4"},
  {x:8,y:362,w:98,h:22,name:"cemiterio_superior_esq"},
  {x:140,y:362,w:115,h:22,name:"cemiterio_superior_dir"},
  {x:243,y:362,w:14,h:194,name:"cemiterio_direita"},
  {x:8,y:362,w:12,h:194,name:"cemiterio_esquerda"},
  {x:8,y:536,w:249,h:20,name:"cemiterio_base"},
  {x:150,y:372,w:55,h:55,name:"capela"},
  {x:455,y:415,w:225,h:110,name:"lago"}
];
const OBSTACLES=[];
function rebuildMap(){
  const w=(images.mapa.naturalWidth||images.mapa.width||0)*MAP_SCALE;
  const h=(images.mapa.naturalHeight||images.mapa.height||0)*MAP_SCALE;
  MAP.ready=w>0&&h>0;MAP.w=w;MAP.h=h;
  if(MAP.ready){
    MAP.minX=-w/2;MAP.maxX=w/2;MAP.minY=-h/2;MAP.maxY=h/2;
    OBSTACLES.length=0;
    for(const r of OBSTACLES_IMAGE)OBSTACLES.push({x:r.x*MAP_SCALE-w/2,y:r.y*MAP_SCALE-h/2,w:r.w*MAP_SCALE,h:r.h*MAP_SCALE,name:r.name});
  }else{
    MAP.minX=-Infinity;MAP.maxX=Infinity;MAP.minY=-Infinity;MAP.maxY=Infinity;OBSTACLES.length=0;
  }
  if(player){if(game.state===STATES.MENU){const sp=spawnPoint();player.x=sp.x;player.y=sp.y}clampPlayerToMap()}updateCamera();
}
images.mapa.onload=rebuildMap;
images.mapa.onerror=rebuildMap;
images.mapa.src="mapa.png";
function circleRectHit(x,y,r,o){const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);const dx=x-nx,dy=y-ny;return dx*dx+dy*dy<r*r}
function collidesCircle(x,y,r){for(const o of OBSTACLES)if(circleRectHit(x,y,r,o))return true;return false}
function moveWithCollision(entity,dx,dy){const r=entity.r||0;const nx=entity.x+dx;if(!collidesCircle(nx,entity.y,r))entity.x=nx;const ny=entity.y+dy;if(!collidesCircle(entity.x,ny,r))entity.y=ny}
function clampPlayerToMap(){if(!MAP.ready||!player)return;player.x=clamp(player.x,MAP.minX+player.r,MAP.maxX-player.r);player.y=clamp(player.y,MAP.minY+player.r,MAP.maxY-player.r)}
function spawnPoint(){if(!MAP.ready)return{x:0,y:0};return{x:350*MAP_SCALE-MAP.w/2,y:170*MAP_SCALE-MAP.h/2}}
function updateCamera(){if(!player){cam.x=0;cam.y=0;return}if(!MAP.ready){cam.x=player.x;cam.y=player.y;return}const hw=canvas.width/2,hh=canvas.height/2;cam.x=(MAP.w<=canvas.width)?0:clamp(player.x,MAP.minX+hw,MAP.maxX-hw);cam.y=(MAP.h<=canvas.height)?0:clamp(player.y,MAP.minY+hh,MAP.maxY-hh)}
function drawNight(){
  if(!NIGHT.on)return;
  dctx.globalCompositeOperation="source-over";dctx.clearRect(0,0,dark.width,dark.height);dctx.fillStyle="rgba(5,9,35,"+NIGHT.darkness+")";dctx.fillRect(0,0,dark.width,dark.height);
  const px=player.x-cam.x+canvas.width/2,py=player.y-cam.y+canvas.height/2;dctx.globalCompositeOperation="destination-out";
  const g=dctx.createRadialGradient(px,py,40,px,py,NIGHT.lightRadius);g.addColorStop(0,"rgba(0,0,0,1)");g.addColorStop(1,"rgba(0,0,0,0)");dctx.fillStyle=g;dctx.beginPath();dctx.arc(px,py,NIGHT.lightRadius,0,Math.PI*2);dctx.fill();ctx.drawImage(dark,0,0);dctx.globalCompositeOperation="source-over";
}
function drawDebugObstacles(){if(!DEBUG||!game.debugObstacles||game.state!==STATES.PLAYING)return;ctx.save();ctx.translate(canvas.width/2-cam.x,canvas.height/2-cam.y);ctx.strokeStyle="rgba(255,60,60,.9)";ctx.fillStyle="rgba(255,60,60,.12)";ctx.lineWidth=2;ctx.font="12px monospace";for(const o of OBSTACLES){ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.fillStyle="#ff8888";ctx.fillText(o.name+" "+Math.round((o.x+MAP.w/2)/MAP_SCALE)+","+Math.round((o.y+MAP.h/2)/MAP_SCALE),o.x,o.y-4);ctx.fillStyle="rgba(255,60,60,.12)"}ctx.restore()}

/* 8. MUNDO/ENTIDADES */
/* 9. JOGADOR */
function createPlayer(id){
  const ch=CHARACTERS[id]||CHARACTERS.guerreiro;
  const shop=persistent.shop;
  const hpBonus=1+shop.vida*.05, damageBonus=1+shop.dano*.03, speedBonus=1+shop.velocidade*.02, xpRadiusBonus=1+shop.ima*.05, xpBonus=1+shop.xp*.03;
  return {x:0,y:0,r:CONFIG.player.radius,speed:ch.speed*speedBonus,hp:ch.hp*hpBonus,maxHp:ch.hp*hpBonus,xp:0,level:1,invuln:0,regen:0,
    damage:3*damageBonus,mageDamage:CONFIG.weapons.magic.damage*damageBonus,mageRadius:CONFIG.weapons.magic.radius,mageExplosionChance:CONFIG.weapons.magic.explosionChance,swordRange:CONFIG.weapons.sword.range,fireRate:1,shotCooldown:0,
    xpMult:xpBonus,xpRadius:CONFIG.xp.baseRadius*xpRadiusBonus,projectileCount:1,weapon:ch.weapon,attackAnim:0,
    upgrades:{},autoWeapons:{},autoCooldowns:{pistola:0,bumerangue:0,explosao:0,raio:0},orbAngle:0,coins:0,buffs:{speed:0,damage:0,magnet:0}};
}

/* 10. ARMAS PRINCIPAIS */
function getAimAngle(){const wx=cam.x+(mouse.x-canvas.width/2),wy=cam.y+(mouse.y-canvas.height/2);return Math.atan2(wy-player.y,wx-player.x)}
function angleDelta(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function addEffect(effect){return addEntity(world.effects,effect,CONFIG.limits.effects)}
function getDamageMultiplier(){return player&&player.buffs.damage>0?1.5:1}
function getAutoDamageMultiplier(){const shopBonus=1+(persistent.shop.dano||0)*.03;return shopBonus*getDamageMultiplier()}
function getMoveSpeed(){return player.speed*(player.buffs.speed>0?1.4:1)}
function getXpRadius(){return player.xpRadius*(player.buffs.magnet>0?4:1)}
function spawnGroundItem(type,x,y,extra={}){return addEntity(world.pickups,{type,x,y,r:type==="coin"?8:10,life:CONFIG.drops.itemLife,maxLife:CONFIG.drops.itemLife,...extra},CONFIG.limits.pickups)}
function applyEnemyDeathDrops(e){
  if(Math.random()<((CONFIG.drops.coinChance[e.type]||0)))spawnGroundItem("coin",e.x,e.y,{value:e.type==="tank"?CONFIG.drops.tankCoinValue:1,r:7});
  const healChance=e.type==="tank"?CONFIG.drops.tankHealChance:CONFIG.drops.healChance;
  if(Math.random()<healChance)spawnGroundItem("heal",e.x+rand(-5,5),e.y+rand(-5,5),{r:10});

function spawnAutoPistol(){const c=CONFIG.automatic.pistola,lvl=autoWeaponLevel("pistola");if(!lvl)return;const target=findNearestEnemy(player.x,player.y,c.range);if(!target)return;const count=Math.min(c.projectiles[lvl-1],CONFIG.limits.shots-world.shots.length);const base=Math.atan2(target.y-player.y,target.x-player.x);for(let i=0;i<count;i++){const off=count===1?0:(i-(count-1)/2)*.12;addEntity(world.shots,{type:"autoPistol",x:player.x,y:player.y,vx:Math.cos(base+off)*c.speed,vy:Math.sin(base+off)*c.speed,r:c.radius,life:1.2,dmg:c.damage[lvl-1]*getAutoDamageMultiplier()},CONFIG.limits.shots)}}

function autoLightning(){const c=CONFIG.automatic.raio,lvl=autoWeaponLevel("raio");if(!lvl)return;const list=world.enemies.filter(e=>!e.dead&&dist(e,player)<=c.range).sort((a,b)=>dist(a,player)-dist(b,player)).slice(0,c.targets[lvl-1]);if(!list.length)return;const damage=c.damage[lvl-1]*getAutoDamageMultiplier();for(const e of list){hitEnemy(e,damage);addEffect({type:"lightning",x1:player.x,y1:player.y,x2:e.x,y2:e.y,life:.15,maxLife:.15})}}

function updateAutoOrbs(dt){const c=CONFIG.automatic.orbe,lvl=autoWeaponLevel("orbe");if(!lvl){for(const s of world.shots)if(s.type==="autoOrb")s.dead=true;return}ensureAutoOrbs();const count=c.count[lvl-1];player.orbAngle=(player.orbAngle+c.rotation*dt)%(Math.PI*2);for(const s of world.shots){if(s.dead||s.type!=="autoOrb")continue;s.angle=player.orbAngle+s.index*(Math.PI*2/count);s.x=player.x+Math.cos(s.angle)*c.radius[lvl-1];s.y=player.y+Math.sin(s.angle)*c.radius[lvl-1];for(const e of world.enemies){if(e.dead)continue;const key=e.id;const lastHit=s.hitMap[key]||-Infinity;if(game.time-lastHit>=c.hitCooldown&&dist(e,s)<=e.r+s.r){hitEnemy(e,s.dmg*getAutoDamageMultiplier());s.hitMap[key]=game.time}}}}

  for(const id of ids){const lvl=autoWeaponLevel(id);if(!lvl)continue;player.autoCooldowns[id]=Math.max(0,player.autoCooldowns[id]-dt);if(player.autoCooldowns[id]>0)continue;const c=CONFIG.automatic[id];if(id==="pistola")spawnAutoPistol();else if(id==="bumerangue")spawnAutoBoomerang();else if(id==="explosao")autoScythe();else if(id==="raio")autoLightning();player.autoCooldowns[id]=c.intervals[lvl-1]}

function updateAutomaticShots(dt){

    if(s.type==="boomerang"){
      let speed=CONFIG.automatic.bumerangue.speed;if(s.phase==="out"){s.x+=s.vx*speed*dt;s.y+=s.vy*speed*dt;s.distance+=speed*dt;if(s.distance>=s.travel)s.phase="return"}else{const a=Math.atan2(player.y-s.y,player.x-s.x);s.vx=Math.cos(a);s.vy=Math.sin(a);s.x+=s.vx*speed*dt;s.y+=s.vy*speed*dt;if(dist(s,player)<=player.r+8)s.dead=true}

  {until:60,weights:{zombie:100}},

function spawnPosition(radius,minDistance=0){
  const d=Math.max(canvas.width,canvas.height)*.65;const b=MAP.ready?MAP:null;
  const inside=(x,y)=>!b||(x>b.minX+20+radius&&x<b.maxX-20-radius&&y>b.minY+20+radius&&y<b.maxY-20-radius);
  const off=(x,y)=>Math.abs(x-cam.x)>canvas.width/2+20||Math.abs(y-cam.y)>canvas.height/2+20;
  const valid=(x,y)=>inside(x,y)&&off(x,y)&&!collidesCircle(x,y,radius)&&Math.hypot(x-player.x,y-player.y)>=minDistance;
  let x=0,y=0,ok=false;
  for(let i=0;i<60&&!ok;i++){const a=Math.random()*Math.PI*2;x=player.x+Math.cos(a)*d;y=player.y+Math.sin(a)*d;ok=valid(x,y)}
  for(let i=0;i<40&&!ok&&b;i++){x=rand(b.minX+20+radius,b.maxX-20-radius);y=rand(b.minY+20+radius,b.maxY-20-radius);ok=valid(x,y)}
  if(!ok&&b&&((b.maxX-b.minX)<=canvas.width||(b.maxY-b.minY)<=canvas.height)){
    for(let i=0;i<40&&!ok;i++){const a=Math.random()*Math.PI*2,r=350+Math.random()*Math.max(canvas.width,canvas.height);x=player.x+Math.cos(a)*r;y=player.y+Math.sin(a)*r;ok=inside(x,y)&&!collidesCircle(x,y,radius)&&Math.hypot(x-player.x,y-player.y)>=Math.max(350,minDistance)}
  }

}

    if(e.bossShotTimer<=0){e.bossShotTimer=cfg.shotInterval;const base=Math.atan2(player.y-e.y,player.x-e.x);for(let i=0;i<cfg.shotCount;i++){const off=(i-(cfg.shotCount-1)/2)*cfg.shotSpread;bossProjectile(e,base+off,cfg.shotSpeed,cfg.shotDamage,4,6)}}
    const d=dist(e,player),a=Math.atan2(player.y-e.y,player.x-e.x);if(d<280)moveEnemyWithCollision(e,-Math.cos(a)*e.speed*dt,-Math.sin(a)*e.speed*dt);else if(d>330)moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);return true;
  }
  if(e.bossType==="skeletonKing"){
    if(e.bossSpiral>0){e.bossSpiral=Math.max(0,e.bossSpiral-dt);e.bossAttackTimer-=dt;if(e.bossAttackTimer<=0){e.bossAttackTimer=cfg.spiralTick;e.bossSpiralAngle+=.18;for(let i=0;i<cfg.arms;i++)bossProjectile(e,e.bossSpiralAngle+i*Math.PI*2/cfg.arms,cfg.projectileSpeed,cfg.projectileDamage,cfg.projectileLife,6)}return true}
    if(e.bossSlamWarning>0){e.bossSlamWarning=Math.max(0,e.bossSlamWarning-dt);if(e.bossSlamWarning===0){if(dist(e,player)<=cfg.slamRadius+player.r)player.hp-=cfg.slamDamage;addEffect({type:"bossSlam",x:e.x,y:e.y,radius:cfg.slamRadius,life:.5,maxLife:.5});}return true}
    e.bossAttackTimer-=dt;if(e.bossAttackTimer<=0){e.bossAttackTimer=cfg.attackInterval;if(e.bossPhase%2===0){e.bossSpiral=cfg.spiralDuration;e.bossAttackTimer=0;e.bossSpiralAngle=0;setCenterMessage("💀 Espiral do Rei!",1)}else{e.bossSlamWarning=cfg.slamWarning;setCenterMessage("💀 GOLPE NO CHÃO!",1)}e.bossPhase++;return true}
    const a=Math.atan2(player.y-e.y,player.x-e.x);moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);return true;
  }
  return false;
}
function triggerMiniBoss(){
  if(game.time+0.001<game.nextMiniBossAt)return;
  game.nextMiniBossAt+=CONFIG.waves.miniBossPeriod;
  game.miniBossWarnings++;
  setCenterMessage("⚠️ Mini-chefe chegando!",CONFIG.waves.warning);
}
function spawnMiniBoss(){
  if(game.miniBossWarnings<=0||game.state!==STATES.PLAYING)return false;
  const pos=spawnPosition(CONFIG.enemies.brute.radius);
  if(!pos)return false;
  const e=createEnemy("brute",pos.x,pos.y);addEntity(world.enemies,e,CONFIG.limits.enemies);game.miniBossWarnings--;
  setCenterMessage("💀 BRUTE",1.5);return true;
}
function triggerHorde(){
  if(game.time+0.001<game.nextHordeAt)return;
  game.nextHordeAt+=CONFIG.waves.hordePeriod;
  game.hordeIndex++;
  const cfg=CONFIG.enemies.zombie,radius=Math.max(canvas.width,canvas.height)*.65;
  let spawned=0;
  for(let i=0;i<CONFIG.waves.hordeCount&&world.enemies.length<CONFIG.limits.enemies;i++){
    const baseAngle=i/CONFIG.waves.hordeCount*Math.PI*2;let placed=false;
    for(let attempt=0;attempt<80&&!placed;attempt++){
      const a=attempt<20?baseAngle+(Math.random()-.5)*.12:Math.random()*Math.PI*2;
      const rr=attempt<20?radius*(.96+Math.random()*.08):radius*(.90+Math.random()*.20);
      const x=player.x+Math.cos(a)*rr,y=player.y+Math.sin(a)*rr;
      const inside=!MAP.ready||(x>MAP.minX+20+cfg.radius&&x<MAP.maxX-20-cfg.radius&&y>MAP.minY+20+cfg.radius&&y<MAP.maxY-20-cfg.radius);
      const off=Math.abs(x-cam.x)>canvas.width/2+20||Math.abs(y-cam.y)>canvas.height/2+20;
      if(inside&&off&&!collidesCircle(x,y,cfg.radius)){addEntity(world.enemies,createEnemy("zombie",x,y),CONFIG.limits.enemies);spawned++;placed=true}
    }
  }
  if(spawned>0)setCenterMessage("🧟 Horda: "+spawned+" zumbis",1.5);
}
function updateWaveDirector(dt){
  waveClock+=dt;
  if(game.centerMessageTime>0){game.centerMessageTime=Math.max(0,game.centerMessageTime-dt);if(game.centerMessageTime===0)game.centerMessage=""}
  triggerMiniBoss();
  if(game.miniBossWarnings>0&&game.centerMessageTime<=0)spawnMiniBoss();
  triggerBoss();
  if(game.bossWarnings>0&&game.centerMessageTime<=0)spawnBoss();
  triggerHorde();
  spawnTimer-=dt;
  if(spawnTimer<=0){spawnBasicEnemy();const interval=Math.max(CONFIG.waves.spawnIntervalMin,CONFIG.waves.spawnIntervalStart-game.time/180);spawnTimer=game.bossActive?interval*CONFIG.waves.bossMultiplier:interval}
}
function moveEnemyWithCollision(e,dx,dy){moveWithCollision(e,dx,dy);}
function bruteUpdate(e,dt){
  if(e.chargeTime>0){e.chargeTime=Math.max(0,e.chargeTime-dt);moveEnemyWithCollision(e,Math.cos(e.chargeAngle)*CONFIG.enemies.brute.chargeSpeed*dt,Math.sin(e.chargeAngle)*CONFIG.enemies.brute.chargeSpeed*dt);return}
  if(e.chargeWarning>0){e.chargeWarning=Math.max(0,e.chargeWarning-dt);if(e.chargeWarning===0){e.chargeTime=CONFIG.enemies.brute.chargeTime;e.chargeAngle=Math.atan2(player.y-e.y,player.x-e.x)}return}
  e.chargeTimer-=dt;if(e.chargeTimer<=0){e.chargeTimer=CONFIG.enemies.brute.chargeInterval;e.chargeWarning=CONFIG.enemies.brute.chargeWarning;return}
  const a=Math.atan2(player.y-e.y,player.x-e.x);moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);
}
function explodeEnemy(e){
  const cfg=CONFIG.enemies.exploder;
  e.dead=true;
  addEffect({type:"enemyExplosion",x:e.x,y:e.y,radius:cfg.explosionRadius,life:.35,maxLife:.35});
  if(dist(e,player)<=cfg.explosionRadius+player.r)player.hp-=cfg.explosionDamage;
  for(const other of world.enemies){if(other!==e&&!other.dead&&dist(e,other)<=cfg.explosionRadius)other.hp-=cfg.explosionDamage*.5}
}
function shooterFire(e){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  addEntity(world.enemyShots,{x:e.x,y:e.y,vx:Math.cos(a)*CONFIG.enemies.shooter.shotSpeed,vy:Math.sin(a)*CONFIG.enemies.shooter.shotSpeed,r:CONFIG.enemies.shooter.shotRadius,life:CONFIG.enemies.shooter.shotLife,damage:CONFIG.enemies.shooter.shotDamage},CONFIG.limits.enemyShots);
}
function updateEnemySpecial(e,dt){
  if(e.isBoss)return updateBoss(e,dt);
  if(e.type==="shooter"){
    e.shotTimer-=dt;if(e.shotTimer<=0){e.shotTimer=CONFIG.enemies.shooter.shotInterval;shooterFire(e)}
    const d=dist(e,player),a=Math.atan2(player.y-e.y,player.x-e.x);
    if(d<CONFIG.enemies.shooter.keepMin)moveEnemyWithCollision(e,-Math.cos(a)*e.speed*dt,-Math.sin(a)*e.speed*dt);
    else if(d>CONFIG.enemies.shooter.keepMax)moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);
    return true;
  }
  if(e.type==="exploder"){
    if(e.fuse>0){e.fuse=Math.max(0,e.fuse-dt);if(e.fuse===0)explodeEnemy(e);return true}
    const d=dist(e,player);
    if(d<=CONFIG.enemies.exploder.fuseDistance){e.fuse=CONFIG.enemies.exploder.fuseTime;e.blink=CONFIG.enemies.exploder.fuseTime;return true}
    const a=Math.atan2(player.y-e.y,player.x-e.x);moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);return true;
  }
  if(e.type==="brute"){bruteUpdate(e,dt);return true}
  return false;
}
function updateEnemies(dt){
  for(const e of world.enemies){
    if(e.dead)continue;e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
    if(e.blink>0)e.blink=Math.max(0,e.blink-dt);
    if(!updateEnemySpecial(e,dt)){const a=Math.atan2(player.y-e.y,player.x-e.x);moveEnemyWithCollision(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt)}
    if(e.dead)continue;
    if(dist(e,player)<e.r+player.r&&e.contact>0)player.hp-=e.contact*dt;
  }
}
function updateEnemyShots(dt){
  for(const s of world.enemyShots){if(s.dead)continue;s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(dist(s,player)<=s.r+player.r){player.hp-=s.damage;s.dead=true;continue}if(s.life<=0||collidesCircle(s.x,s.y,s.r))s.dead=true}
}

function recordRun(){if(!player)return;const r=persistent.records,b=persistent.byCharacter[game.character];r.bestTime=Math.max(r.bestTime,game.time);r.bestLevel=Math.max(r.bestLevel,player.level);r.bestKills=Math.max(r.bestKills,game.kills);b.bestTime=Math.max(b.bestTime,game.time);b.bestLevel=Math.max(b.bestLevel,player.level);b.bestKills=Math.max(b.bestKills,game.kills);saveGame()}
function shopCost(base,level){return Math.floor(base*Math.pow(1.35,level))}
function buyShop(id){const item=SHOP_ITEMS[id];if(item){if(item.type==="character"&&persistent.unlockedCharacters.includes(item.id))return;if(item.type==="weapon"&&persistent.unlockedWeapons.includes(item.id))return;if(persistent.coins<item.cost)return; persistent.coins-=item.cost;if(item.type==="character")persistent.unlockedCharacters.push(item.id);else persistent.unlockedWeapons.push(item.id);saveGame();showShop();return}const u=SHOP_UPGRADES.find(x=>x.id===id);if(!u)return;const lvl=persistent.shop[u.id]||0;if(lvl>=u.max)return;const cost=shopCost(u.base,lvl);if(persistent.coins<cost)return;persistent.coins-=cost;persistent.shop[u.id]=lvl+1;saveGame();showShop()}

function upgradeLevel(id){return player.upgrades[id]||0}
function canUseUpgrade(u){return (!u.characters||u.characters.includes(game.character))&&(u.max===null||upgradeLevel(u.id)<u.max)}
function eligibleUpgradePool(){return UPGRADES.filter(canUseUpgrade).concat(autoUpgradeCards())}
function pickLevelChoices(){
  const pool=eligibleUpgradePool();
  levelChoices=[];
  while(levelChoices.length<3&&pool.length){
    const i=Math.floor(Math.random()*pool.length);
    levelChoices.push(pool.splice(i,1)[0]);
  }
  // As melhorias ilimitadas garantem pelo menos 3 opções válidas.
  if(levelChoices.length<3){
    for(const u of UPGRADES){
      if(levelChoices.length>=3)break;
      if(u.max===null&&!levelChoices.some(x=>x.id===u.id)&&(!u.characters||u.characters.includes(game.character)))levelChoices.push(u);
    }
  }
}
function applyUpgrade(id){
  if(id.startsWith("auto:")){const wid=id.slice(5),c=CONFIG.automatic[wid],level=autoWeaponLevel(wid);if(!c||level>=5)return false;if(level===0&&autoWeaponOwnedCount()>=3)return false;player.autoWeapons[wid]=level+1;player.autoCooldowns[wid]=0;setCenterMessage((c.icon||"⚙️")+" "+c.name+" nível "+(level+1),.9);return true}
  const u=UPGRADES.find(x=>x.id===id);
  if(!u||!canUseUpgrade(u))return false;
  player.upgrades[id]=upgradeLevel(id)+1;
  if(id==="damage"){player.damage*=1.20;player.mageDamage*=1.20}
  else if(id==="maxhp"){player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}
  else if(id==="speed"){player.speed*=1.10}
  else if(id==="xpRadius"){player.xpRadius*=1.30}
  else if(id==="regen"){player.regen+=0.5}
  else if(id==="heal"){player.hp=Math.min(player.maxHp,player.hp+player.maxHp*0.5)}
  else if(id==="fireRate"){player.fireRate*=1.20}
  else if(id==="projectileCount"){player.projectileCount++}
  else if(id==="swordRange"){player.swordRange*=1.15}
  else if(id==="mageRadius"){player.mageRadius*=1.20}
  else if(id==="mageDamage"){player.mageDamage*=1.20}
  else if(id==="mageProjectiles"){player.projectileCount++}
  return true;
}
function showLevelUp(){
  pickLevelChoices();
  levelUpOpenedAt=performance.now();
  const currentLevel=player.level-game.pendingLevelUps+1;
  const title=chestUpgradePending?"🎁 Baú: escolha uma melhoria":"⬆️ Nível "+currentLevel;
  const cards=levelChoices.map((u,i)=>'<button class="char-card upgrade-card" data-action="upgrade" data-upgrade="'+u.id+'"><b>'+String(i+1)+'. '+u.icon+' '+u.name+'</b><br><small>Nível '+(upgradeLevel(u.id)+1)+(u.max===null?'':' / '+u.max)+'<br>'+u.desc+'</small></button>').join('');
  showOverlay('<div class="panel"><h2>'+title+'</h2><p>Escolha uma melhoria:</p><div class="char-grid">'+cards+'</div><p class="hint">Teclas 1, 2 ou 3 também escolhem uma carta.</p></div>');
}
function setState(next){
  game.state=next;
  const playing=next===STATES.PLAYING;
  document.body.classList.toggle("playing",playing);
  hud.style.display=playing?"block":"none";
  help.style.display=playing?"block":"none";
  adminBtn.style.display=(ADMIN_MODE&&game.state===STATES.PLAYING)?"block":"none";
  if(next===STATES.MENU){bankRunCoins();showMenu();}
  else if(next===STATES.PAUSED)showPause();
  else if(next===STATES.GAME_OVER){bankRunCoins();showGameOver();}
  else if(next===STATES.LEVEL_UP)showLevelUp();
  else if(playing)hideOverlay();
}

function showGameOver(){recordRun();showOverlay('<div class="panel"><h2>💀 Fim de jogo</h2><p>'+CHARACTERS[game.character].name+' • Nível '+player.level+' • Tempo '+fmtTime(game.time)+' • Abates '+game.kills+'</p><div class="actions"><button data-action="restart">Jogar de novo</button><button data-action="menu">Menu</button></div></div>')}
function togglePause(){if(game.state===STATES.PLAYING)setState(STATES.PAUSED);else if(game.state===STATES.PAUSED)setState(STATES.PLAYING)}
function startRun(id){const next=id||game.character;if(!persistent.unlockedCharacters.includes(next))return;game.character=next;resetRun();setState(STATES.PLAYING)}
function resetRun(){clearWorld();game.time=0;game.kills=0;game.pendingLevelUps=0;game.bossActive=false;game.bossWarnings=0;game.bossNumber=0;game.bossCycle=0;game.nextBossAt=CONFIG.bosses.interval;game.miniBossWarnings=0;game.nextMiniBossAt=CONFIG.waves.miniBossFirst;game.nextHordeAt=CONFIG.waves.hordeFirst;game.hordeIndex=0;chestUpgradePending=false;game.centerMessage="";game.centerMessageTime=0;spawnTimer=0;waveClock=0;levelChoices=[];player=createPlayer(game.character);const sp=spawnPoint();player.x=sp.x;player.y=sp.y;clampPlayerToMap();updateCamera()}
function confirmLevelUp(upgradeId){
  if(game.state!==STATES.LEVEL_UP||performance.now()-levelUpOpenedAt<350)return;
  if(!levelChoices.some(u=>u.id===upgradeId))return;
  if(!applyUpgrade(upgradeId))return;
  if(chestUpgradePending){chestUpgradePending=false;setState(STATES.PLAYING);return}
  game.pendingLevelUps=Math.max(0,game.pendingLevelUps-1);
  if(game.pendingLevelUps>0)setState(STATES.LEVEL_UP);else setState(STATES.PLAYING);
}
overlay.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="character")startRun(b.dataset.character);else if(a==="resume")setState(STATES.PLAYING);else if(a==="quit"){recordRun();setState(STATES.MENU)}else if(a==="restart")startRun();else if(a==="menu")setState(STATES.MENU);else if(a==="upgrade")confirmLevelUp(b.dataset.upgrade);else if(a==="shop")showShop();else if(a==="records")showRecords();else if(a==="shopBuy")buyShop(b.dataset.shop);else if(a==="admin")showAdmin();else if(a==="adminClose")setState(STATES.PLAYING);else if(a==="adminLevel")adminAddLevel();else if(a==="adminLevelSet")adminSetLevel(10);else if(a==="adminWeapon")adminEquipWeapon(b.dataset.weapon);else if(a==="adminAuto")adminAutoWeapon(b.dataset.auto);else if(a==="adminAutoLevel")adminAutoLevel(b.dataset.auto);else if(a==="adminSpawn")adminSpawn(b.dataset.spawn);else if(a==="adminTime"){game.time+=60;setCenterMessage("ADM: +60s",.9);showAdmin()}else if(a==="adminCoins"){player.coins+=100;persistent.coins+=100;saveGame();setCenterMessage("ADM: +100 moedas",.9);showAdmin()}});

/* 13. ENTRADA */
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k===" "||k.startsWith("arrow"))e.preventDefault();
  if(!e.repeat){
    if(k==="f2"&&ADMIN_MODE){showAdmin();return;}
    if(k==="0"){DEBUG=!DEBUG;if(DEBUG)window.__NS={game,player,world,MAP,OBSTACLES,cam,CHARACTERS}}
    else if(k==="9"&&DEBUG&&game.state===STATES.PLAYING)game.debugObstacles=!game.debugObstacles;
    else if(k==="p"||k==="escape")togglePause();
    else if(game.state===STATES.LEVEL_UP&&(k==="1"||k==="2"||k==="3"))confirmLevelUp(levelChoices[Number(k)-1]?.id);
    else if(k==="enter"){
      e.preventDefault();
      if(game.state===STATES.GAME_OVER)startRun();
      else if(game.state===STATES.PAUSED)setState(STATES.PLAYING);
    }else if(k==="r"&&game.state===STATES.GAME_OVER)startRun();

});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("mousedown",e=>{if(e.button===0&&!e.target.closest("#overlay")&&game.state===STATES.PLAYING)shoot()});
addEventListener("blur",()=>{releaseKeys();if(game.state===STATES.PLAYING)setState(STATES.PAUSED)});

/* 14. UPDATE */
let gameDt=0;
function updateEffects(dt){
  for(const fx of world.effects){if(fx.dead)continue;fx.life-=dt;if(fx.type==="magicExplosion"&&fx.particles)for(const q of fx.particles)q.life-=dt;if(fx.life<=0)fx.dead=true}
}
function updateShots(dt){
  for(const s of world.shots){
    if(s.dead||s.type==="autoOrb"||s.type==="boomerang"||s.type==="autoPistol")continue;s.life-=dt;const ox=s.x,oy=s.y;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.type==="magic"){
      s.travel+=Math.hypot(s.x-ox,s.y-oy);s.spin+=dt*5;
      if(world.effects.length<CONFIG.limits.effects-CONFIG.limits.trailReserve)addEffect({type:"trail",x:ox,y:oy,r:2+Math.random()*2,life:.25,maxLife:.25});
      let hit=false;for(const e of world.enemies){if(!e.dead&&dist(e,s)<=e.r+s.r){hit=true;break}}
      if(hit){if(Math.random()<player.mageExplosionChance)magicExplosion(s.x,s.y);s.dead=true;continue}
      if(s.travel>=s.maxTravel||s.life<=0){s.dead=true}
    }else{
      if(s.life<=0){s.dead=true;continue}
      for(const e of world.enemies){if(e.dead)continue;if(dist(e,s)<=e.r+s.r){hitEnemy(e,s.dmg);s.dead=true;break}}
    }
  }
}
function updateGems(dt){
  for(const g of world.gems){if(g.dead)continue;const d=dist(g,player);if(d<=getXpRadius()&&d>0){const a=Math.atan2(player.y-g.y,player.x-g.x);g.x+=Math.cos(a)*CONFIG.xp.magnetSpeed*dt;g.y+=Math.sin(a)*CONFIG.xp.magnetSpeed*dt}if(dist(g,player)<=player.r+g.r){g.dead=true;player.xp+=(g.value||1)*player.xpMult;while(player.xp>=xpNeeded(player.level)){player.xp-=xpNeeded(player.level);player.level++;game.pendingLevelUps++}}}
}
function update(dt){
  gameDt=dt;game.time+=dt;player.shotCooldown=Math.max(0,player.shotCooldown-dt);player.attackAnim=Math.max(0,player.attackAnim-dt);if(player.invuln>0)player.invuln=Math.max(0,player.invuln-dt);
  if(player.regen>0)player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);updateBuffs(dt);
  const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){const n=Math.hypot(dx,dy)||1;moveWithCollision(player,dx/n*getMoveSpeed()*dt,dy/n*getMoveSpeed()*dt);clampPlayerToMap();}
  updateWaveDirector(dt);updateEnemies(dt);updateEnemyShots(dt);updateAutomaticWeapons(dt);updateAutomaticShots(dt);updateShots(dt);updateEffects(dt);updateGems(dt);updatePickups(dt);updateChests();cleanup();
  if(!Number.isFinite(player.x))player.x=0;if(!Number.isFinite(player.y))player.y=0;if(!Number.isFinite(player.hp))player.hp=player.maxHp;player.hp=clamp(player.hp,0,player.maxHp);updateCamera();
  if(player.hp<=0){setState(STATES.GAME_OVER);return}if(game.pendingLevelUps>0)setState(STATES.LEVEL_UP);
}

/* 15. DRAW */

  for(const g of world.gems){const pulse=1+Math.sin(performance.now()/180+g.x*.01)*.12;drawGlowCircle(g.x,g.y,g.r,"#4ade80",.16);ctx.save();ctx.translate(g.x,g.y);ctx.rotate(performance.now()/900);ctx.scale(pulse,pulse);ctx.fillStyle="#4ade80";ctx.beginPath();ctx.moveTo(0,-g.r);ctx.lineTo(g.r,0);ctx.lineTo(0,g.r);ctx.lineTo(-g.r,0);ctx.closePath();ctx.fill();ctx.strokeStyle="#bbf7d0";ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
  for(const s of world.enemyShots){ctx.fillStyle=s.type==="boss"?"#f97316":"#fb7185";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  for(const s of world.shots){

    else{ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  }
  for(const e of world.enemies){
    const blink=e.type==="exploder"&&e.fuse>0&&Math.floor(e.fuse*12)%2===0;
    ctx.globalAlpha=e.isBoss&&e.alpha!==undefined?e.alpha:1;

  if(player){drawEntityShadow(player.x,player.y,player.r);drawGlowCircle(player.x,player.y,player.r,"#60a5fa",.16);const sprite=images[game.character];if(sprite&&sprite.complete&&sprite.naturalWidth>0){ctx.imageSmoothingEnabled=false;ctx.drawImage(sprite,player.x-player.r,player.y-player.r,player.r*2,player.r*2)}else{ctx.fillStyle=CONFIG.colors.player;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#dbeafe";ctx.lineWidth=2;ctx.stroke()}const a=getAimAngle();ctx.strokeStyle="#93c5fd";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(a)*28,player.y+Math.sin(a)*28);ctx.stroke();if(player.invuln>0){ctx.globalAlpha=.35+.25*Math.sin(performance.now()/50);ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}

  if(player){const dmg=player.weapon==="magic"?player.mageDamage:player.damage;const autoHud=Object.entries(player.autoWeapons).filter(([,v])=>v>0).map(([id,v])=>CONFIG.automatic[id].icon+v).join(" ");const bossHud=game.bossActive?" • 👑 CHEFE":game.bossWarnings>0?" • ⚠️ CHEFE":"";stats.textContent=CHARACTERS[game.character].icon+" "+CHARACTERS[game.character].name+" • HP "+Math.ceil(player.hp)+"/"+player.maxHp+" • Nível "+player.level+" • Dano "+(dmg*getDamageMultiplier()).toFixed(1)+" • 🪙 "+player.coins+" • Auto "+(autoHud||"—")+bossHud+" • Abates "+game.kills+" • "+fmtTime(game.time);hpFill.style.width=(clamp(player.hp/player.maxHp,0,1)*100)+"%";xpFill.style.width=(clamp(player.xp/xpNeeded(player.level),0,1)*100)+"%";const active=[];if(player.buffs.speed>0)active.push("💨 "+player.buffs.speed.toFixed(1));if(player.buffs.damage>0)active.push("🔥 "+player.buffs.damage.toFixed(1));if(player.buffs.magnet>0)active.push("🧲 "+player.buffs.magnet.toFixed(1));buffs.textContent=active.length?active.join(" • "):""}

}

/* 16. LOOP */
function loop(agora){const dt=Math.min(0.033,Math.max(0,(agora-last)/1000));last=agora;if(game.state===STATES.PLAYING)update(dt);draw();requestAnimationFrame(loop)}
